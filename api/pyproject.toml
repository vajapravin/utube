[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mytube-api"
version = "0.1.0"
description = "FastAPI backend service for mytube"
authors = [{ name = "Pravin Vaja", email = "vajapravin23@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "mytube-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
mytube-shared = { path = "../shared/py", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
