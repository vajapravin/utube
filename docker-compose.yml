name: mytube

services:
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: mytube-migrate
    profiles: ["core", "full", "dev"]
    mem_limit: 128m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mytube}:${POSTGRES_PASSWORD:-mytube_secure_dev_password_change_in_prod}@postgres_db:5432/${POSTGRES_DB:-mytube}
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed.categories"]
    networks:
      - mytube_net
      - postgresql_app-net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: mytube-api
    profiles: ["core", "full", "dev"]
    mem_limit: 256m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mytube}:${POSTGRES_PASSWORD:-mytube_secure_dev_password_change_in_prod}@postgres_db:5432/${POSTGRES_DB:-mytube}
      REDIS_URL: redis://redis:6380/0
    ports:
      - "${API_PORT:-8005}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - mytube_net
      - postgresql_app-net
      - redis_app-net

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: mytube-worker
    profiles: ["core", "full", "dev"]
    mem_limit: 256m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mytube}:${POSTGRES_PASSWORD:-mytube_secure_dev_password_change_in_prod}@postgres_db:5432/${POSTGRES_DB:-mytube}
      REDIS_URL: redis://redis:6380/0
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - mytube_net
      - postgresql_app-net
      - redis_app-net

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: mytube-web
    profiles: ["core", "full", "dev"]
    mem_limit: 64m
    ports:
      - "${WEB_PORT:-3005}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    networks:
      - mytube_net

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.0
    container_name: mytube-mock-oidc
    profiles: ["test", "dev"]
    mem_limit: 128m
    ports:
      - "${MOCK_OIDC_PORT:-8087}:8080"
    environment:
      SERVER_PORT: 8080
    networks:
      - mytube_net

  ollama:
    image: ollama/ollama:latest
    container_name: mytube-ollama
    profiles: ["llm-local"]
    mem_limit: 3072m
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - mytube_net

networks:
  mytube_net:
    driver: bridge
  postgresql_app-net:
    name: postgresql_app-net
    external: true
  redis_app-net:
    name: redis_app-net
    external: true

volumes:
  ollama_data:
