[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mytube-shared"
version = "0.1.0"
description = "Shared models, schemas, and utilities for mytube API and worker"
authors = [{ name = "Pravin Vaja", email = "vajapravin23@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["mytube_shared"]
