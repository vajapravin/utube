# Example Docker Compose override file for local development
# Copy to deploy/docker-compose.override.yml to enable hot-reloading and development mounts.
#
# Usage:
#   cp deploy/docker-compose.override.example.yml deploy/docker-compose.override.yml
#   docker compose -f deploy/docker-compose.yml up -d

services:
  api:
    volumes:
      - ../api/app:/app/app:ro
      - ../shared/py/mytube_shared:/app/mytube_shared:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: development

  worker:
    volumes:
      - ../worker/app:/app/app:ro
      - ../shared/py/mytube_shared:/app/mytube_shared:ro
    environment:
      APP_ENV: development
