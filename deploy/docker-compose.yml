name: mytube

services:
  postgres:
    image: postgres:16-alpine
    container_name: mytube-postgres
    profiles: ["core", "full"]
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mytube}
      POSTGRES_USER: ${POSTGRES_USER:-mytube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mytube_secure_dev_password_change_in_prod}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5432 -U ${POSTGRES_USER:-mytube} -d ${POSTGRES_DB:-mytube}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
    networks:
      - mytube_net

  redis:
    image: redis:7-alpine
    container_name: mytube-redis
    profiles: ["core", "full"]
    mem_limit: 96m
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
    networks:
      - mytube_net

  migrate:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: mytube-migrate
    profiles: ["core", "full"]
    mem_limit: 128m
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mytube}:${POSTGRES_PASSWORD:-mytube_secure_dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-mytube}
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed.categories"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mytube_net

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: mytube-api
    profiles: ["core", "full"]
    mem_limit: 256m
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mytube}:${POSTGRES_PASSWORD:-mytube_secure_dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-mytube}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8005}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - mytube_net

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    container_name: mytube-worker
    profiles: ["core", "full"]
    mem_limit: 256m
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mytube}:${POSTGRES_PASSWORD:-mytube_secure_dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-mytube}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mytube_net

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: mytube-web
    profiles: ["core", "full"]
    mem_limit: 64m
    ports:
      - "${WEB_PORT:-3005}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    networks:
      - mytube_net

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.0
    container_name: mytube-mock-oidc
    profiles: ["test"]
    mem_limit: 128m
    ports:
      - "${MOCK_OIDC_PORT:-8087}:8080"
    environment:
      SERVER_PORT: 8080
    networks:
      - mytube_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mytube-cloudflared
    profiles: ["cloudflare"]
    mem_limit: 48m
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    networks:
      - mytube_net

  ollama:
    image: ollama/ollama:latest
    container_name: mytube-ollama
    profiles: ["llm-local"]
    mem_limit: 3072m
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - mytube_net

networks:
  mytube_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
